<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} · 公众号预览</title>
  <style>
    body { margin: 0; background: #e8eaed; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    .gzhb-bar { position: fixed; top: 0; left: 0; right: 0; height: 52px; background: #fff; box-shadow: 0 1px 8px rgba(0,0,0,.08); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 20; }
    .gzhb-bar p { margin: 0; font-size: 13px; color: #4b5563; }
    .gzhb-bar strong { color: #111827; }
    .gzhb-btn { background: #1f2937; color: #fff; border: 0; border-radius: 8px; padding: 9px 18px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .gzhb-btn:hover { background: #111827; }
    .gzhb-toast { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 30; }
    .gzhb-toast.on { opacity: 1; }
    .gzhb-stage { max-width: 700px; margin: 76px auto 56px; padding: 0 8px; }
  </style>
</head>
<body>
  <div class="gzhb-bar">
    <p>打开后点右侧按钮，再到公众号编辑器 <strong>粘贴</strong></p>
    <button type="button" class="gzhb-btn" id="gzhb-copy">复制到公众号</button>
  </div>
  <div class="gzhb-toast" id="gzhb-toast"></div>
  <div class="gzhb-stage">
    <div id="gzhb-article">{{ARTICLE}}</div>
  </div>
  <script>
    function toast(msg) {
      var el = document.getElementById("gzhb-toast");
      el.textContent = msg;
      el.classList.add("on");
      clearTimeout(el._t);
      el._t = setTimeout(function () { el.classList.remove("on"); }, 2600);
    }
    document.getElementById("gzhb-copy").addEventListener("click", function () {
      var article = document.getElementById("gzhb-article");
      var range = document.createRange();
      range.selectNodeContents(article);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      sel.removeAllRanges();
      toast(ok ? "已复制，去公众号编辑器粘贴" : "自动复制失败，请手动全选后再复制");
    });
  </script>
</body>
</html>
